<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enterprise Document Intelligence</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17202a}main{display:grid;gap:1rem}section{border:1px solid #d9e2ec;border-radius:8px;padding:1rem}textarea{width:100%;min-height:100px}button{background:#1769aa;color:#fff;border:0;border-radius:4px;padding:.7rem 1rem;cursor:pointer}.source{font-size:.9rem;color:#536471;margin:.3rem 0}.answer{white-space:pre-wrap;background:#f5f8fa;padding:1rem;border-radius:4px}</style></head>
<body><main><h1>Enterprise Document Intelligence</h1><section><h2>Upload PDFs</h2><input id="files" type="file" accept="application/pdf" multiple><button onclick="upload()">Ingest documents</button><p id="uploadStatus"></p></section><section><h2>Ask your documents</h2><textarea id="question" placeholder="Ask a question about the uploaded documents..."></textarea><button onclick="ask()">Ask</button><div id="answer"></div></section></main><script>async function upload(){const form=new FormData();for(const file of document.getElementById('files').files)form.append('files',file);const response=await fetch('/api/documents/upload',{method:'POST',body:form});document.getElementById('uploadStatus').textContent=response.ok?'Documents ingested.':await response.text()}async function ask(){const question=document.getElementById('question').value;const response=await fetch('/api/rag/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const data=await response.json();document.getElementById('answer').innerHTML='<div class="answer">'+(data.answer||data.message||'No answer')+'</div>'+(data.sources||[]).map(s=>'<div class="source">Source: '+s.filename+' p. '+s.page+'</div>').join('')}</script></body></html>
